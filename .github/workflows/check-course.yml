name: Check course

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-course:
    name: Check course (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.23"

      # uv selects (and if needed installs) the Python in .python-version,
      # exactly as it does for learners.
      - name: Install locked dependency
        run: uv sync --locked

      - name: Check lesson
        run: uv run --locked python script/check_course.py
